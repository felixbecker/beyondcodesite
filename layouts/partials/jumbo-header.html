<section class="vignette relative -mt-6 lg:-mt-20 border-2 text-white h-[75vh] flex items-center justify-center">
  <div class="container mx-auto w-2/3 text-center md:flex md:items-stretch md:justify-between h-full">
    <!-- Text Section -->
    <div class="mt-5 text-content md:w-1/2 flex flex-col leading-relaxed justify-center">
      <h1 class="text-6xl text-left pl-10 leading-snug m-8 font-serif font-bold">
        Tauch ein in die Welt der Macher!
        Geschichten und Einblicke aus
        der Tech-Industrie
      </h1>

      <div class="flex flex-col md:flex-row items-center justify-center mt-6 space-y-4 md:space-y-0 md:space-x-4">
        {{ $latestEpisode := index (sort (where .Site.RegularPages "Type" "episodes") "Date" "desc") 0 }}
        <a href="{{ $latestEpisode.RelPermalink }}"
          class="flex items-center bg-[#D43F06] text-white px-6 py-3 rounded-lg hover:bg-cyan-400 hover:text-gray-700 transition-colors">
          <!-- Play SVG Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="white"
            stroke-width="2">
            <polygon points="5 3, 19 12, 5 21" fill="white" />
          </svg>
          Letzte Folge anhören
        </a>
        <a href="/episodes/" class="bg-cyan-700 text-white px-6 py-3 rounded-lg hover:bg-gray-900 transition-colors">
          Alle Episoden anhören
        </a>
      </div>

      <p class="mt-4 text-xl">Host Felix Becker.</p>
    </div>

    <!-- Image Section -->
    <div class="md:w-1/2 flex justify-center items-end mt-6 md:mt-0 h-full">
      <img src="/images/felix_2_1.png" alt="Beschreibung des Bildes"
        class="max-w-full h-auto w-[90%] md:w-[75%] lg:w-[95%]">
    </div>
  </div>
</section>
